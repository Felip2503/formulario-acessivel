<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário sobre Esportes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Sua paixão. Seu Esporte. Sua opinião.</h1>
        </header>

        <form autocomplete="off">
            <label for="EspFav">Qual seu esporte favorito?</label><br>
            <input type="text" id="EspFav" autocomplete="off"><br>

            <label for="Prat">Você prática algum esporte? Se sim qual?</label><br>
            <input type="text" id="Prat" autocomplete="off"><br>
            
            <label for="Atleta">Qual seu atleta favorito?</label><br>
            <input type="text" id="Atleta" autocomplete="off"><br>

            <label for="equipe">Qual sua Equipe favorita?</label><br>
            <input type="text" id="equipe" autocomplete="off"><br>

            <label for="Comp">Qual a competição Esportiva que você mais acompanha?</label><br>
            <input type="text" id="Comp" autocomplete="off"><br>

            <label for="EspPra">Qual seria seu esporte se pudesse ser profissional?</label><br>
            <div class="radio-options">
                <label><input type="radio" id="fut" name="EspPra" value="Futebol">Futebol/Futsal</label>
                <label><input type="radio" id="Basqute" name="EspPra" value="Basquete">Basquete</label>
                <label><input type="radio" id="Volei" name="EspPra" value="Volei">Vôlei</label>
                <label><input type="radio" id="Tenis" name="EspPra" value="Tenis">Tênis</label>
                <label><input type="radio" id="Auto" name="EspPra" value="Auto">Automobilismo</label>
                <label><input type="radio" id="Nat" name="EspPra" value="Nat">Natação</label>
                <label><input type="radio" id="Lut" name="EspPra" value="Lut">Lutas</label>
                <label><input type="radio" id="Atlet" name="EspPra" value="Atlet">Atletismo</label>
                <label><input type="radio" id="surf" name="EspPra" value="surf">Surfe</label>
                <label><input type="radio" id="skate" name="EspPra" value="skate">Skate</label>
            </div>

            <input type="submit" id="enviar" value="Enviar">
        </form>

        <footer>
            <h2>Feito por Felipe 2DAT2</h2>
        </footer>
    </main>
</body>
</html>
